services:
  postgres:
    image: postgres:16
    container_name: aura-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_payments
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: aura-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: